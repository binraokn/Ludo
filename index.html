<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo - By Binrao</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:10px;margin:0}
.box{background:#1e1e1e;border:2px solid #f7b500;border-radius:18px;padding:15px;max-width:480px;margin:auto}
.board{width:320px;height:320px;margin:10px auto;background:#fff;border:4px solid #000;border-radius:12px;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);overflow:hidden;position:relative}
.cell{border:0.5px solid #ddd;font-size:9px;display:flex;align-items:center;justify-content:center}
.token{width:16px;height:16px;border-radius:50%;border:2px solid #000;display:inline-block}
button{width:100%;padding:14px;margin-top:10px;background:#f7b500;border:2px solid #000;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer}
select,input{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:none;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;background:#000;padding:8px 12px;border-radius:10px}
.coin{color:gold;font-weight:900}
.dev{font-size:12px;color:#aaa;margin-top:10px}
.settings{background:#2a2a2a;padding:10px;border-radius:10px;margin-top:10px;text-align:left}
</style>
</head>
<body>
<div class="box">
<div class="top">
<span>🎲 LUDO KING</span>
<span class="coin">🪙 <span id="coins">1000</span> Coins</span>
</div>

<div class="board" id="board"></div>

<div id="diceBox" style="font-size:22px;font-weight:900;margin:10px">🎲 Roll Karo</div>
<div id="msg" style="background:#000;padding:10px;border-radius:8px;min-height:20px">RED TURN - Roll 2 Dice</div>

<button onclick="roll()">🎲 DICE ROLL KARO</button>

<div class="settings">
<b>⚙️ SETTINGS</b><br>
<label>Players:</label>
<select id="players"><option value="2">2 Players</option><option value="3">3 Players</option><option value="4">4 Players</option></select>
<label>Difficulty (Bot):</label>
<select id="diff"><option value="easy">Easy</option><option value="hard">Hard - Bot ko Jota Zyada</option></select>
<label>Coins Add Karo - Kitne Marzi:</label>
<input type="number" id="addCoinInput" value="1000" placeholder="e.g 10000">
<button onclick="addCoins()" style="background:#fff;padding:10px">🪙 COINS ADD KARO</button>
<button onclick="resetGame()" style="background:#ff4444;color:#fff;padding:10px">🔄 GAME RESET</button>
</div>

<div class="dev">Development by <b style="color:#f7b500">Binrao</b> | Offline Version</div>
</div>

<script>
// --- SETUP ---
let colors=['red','green','yellow','blue'];
let tokens={red:[0,0,0,0],green:[0,0,0,0],yellow:[0,0,0,0],blue:[0,0,0,0]};
let turn=0, dice=0;
let coins=parseInt(localStorage.getItem('binrao_coins')||'1000');
document.getElementById('coins').innerText=coins;

// Board banayo - simple 15x15
let board=document.getElementById('board');
for(let i=0;i<225;i++){
 let d=document.createElement('div'); d.className='cell';
 if(i<45) d.style.background='#ffdddd';
 else if(i>=180) d.style.background='#ddddff';
 else if(i%15==0) d.style.background='#ddffdd';
 else if(i%15==14) d.style.background='#ffffcc';
 board.appendChild(d);
}
function updateBoard(){
 // Simple display - tokens ki position board pe dikhao
 let cells=board.children;
 for(let c of cells) c.innerHTML='';
 colors.forEach((col,ci)=>{
  tokens[col].forEach(p=>{
   if(p>0 && p<225){
    let dot=document.createElement('div');
    dot.className='token'; dot.style.background=col;
    cells[(p+ci*10)%225].appendChild(dot);
   }
  });
 });
}
updateBoard();

function addCoins(){
 let v=parseInt(document.getElementById('addCoinInput').value)||0;
 coins+=v;
 localStorage.setItem('binrao_coins',coins);
 document.getElementById('coins').innerText=coins;
 alert(v+' Coins Add Ho Gaye! Total: '+coins);
}
function resetGame(){
 tokens={red:[0,0,0,0],green:[0,0,0,0],yellow:[0,0,0,0],blue:[0,0,0,0]};
 turn=0; updateBoard();
 document.getElementById('msg').innerText='RED TURN - Roll 2 Dice';
}

// --- TUMHARA WALA DICE CODE ---
let dice1=0,dice2=0;
function roll(){
 dice1=Math.floor(Math.random()*6)+1;
 dice2=Math.floor(Math.random()*6)+1;
 dice=dice1+dice2;
 let isJota = (dice1===dice2);
 document.getElementById('diceBox').innerText=`🎲 ${dice1} + ${dice2} = ${dice} ${isJota?' (JOTA!)' : ''}`;
 
 let diff=document.getElementById('diff').value;
 if(turn!==0 && diff==='hard' && !isJota && Math.random()>0.5){
   dice1=dice2=Math.floor(Math.random()*6)+1;
   dice=dice1+dice2; isJota=(dice1===dice2);
   document.getElementById('diceBox').innerText=`🎲 ${dice1} + ${dice2} = ${dice} (JOTA! - HARD BOT)`;
 }

 window.canBeat = isJota;
 window.isDoubleSix = (dice1===6 && dice2===6);

 document.getElementById('msg').innerText=`${colors[turn].toUpperCase()} got ${dice} ${isJota?'- JOTA se kaat sakta hai!' : '- Single hai, kaat nahi sakta'}`;
 setTimeout(()=>makeMove(isJota), 500);
}

function makeMove(isJota){
 let col=colors[turn];
 function tryBeat(newPos){
   if(!isJota) return false;
   for(let o of colors){
     if(o===col) continue;
     for(let k=0;k<4;k++){
       if(tokens[o][k]===newPos){
           tokens[o][k]=0;
           document.getElementById('msg').innerText+=` 💥 JOTA ne ${o.toUpperCase()} ko kaat diya!`;
           coins+=50; // kaatne par 50 coins bonus
           localStorage.setItem('binrao_coins',coins);
           document.getElementById('coins').innerText=coins;
           return true;
       }
     }
   }
   return false;
 }

 let movable=tokens[col].map((p,i)=> (p===0 && (dice1===6 || dice2===6 || isJota)) || (p>0 && p+dice<=57) ? i : -1).filter(x=>x>=0);
 if(movable.length===0){ nextTurn(); return; }
 
 let idx=movable[0];
 tokens[col][idx]+= (tokens[col][idx]===0 ? 1 : dice);
 tryBeat(tokens[col][idx]);
 updateBoard();
 
 // Jeetne par coins
 if(tokens[col].every(p=>p>=57)){
   coins+=500;
   localStorage.setItem('binrao_coins',coins);
   document.getElementById('coins').innerText=coins;
   alert(colors[turn].toUpperCase()+' JEET GAYA! +500 Coins');
   resetGame(); return;
 }

 if(dice1===6 || dice2===6 || isJota || window.isDoubleSix){
   document.getElementById('msg').innerText+=" - DOUBLE 6 / JOTA = Extra Chance!";
   if(turn!==0) setTimeout(roll, 1200);
 } else {
   nextTurn();
 }
}

function nextTurn(){
 let total=parseInt(document.getElementById('players').value);
 turn=(turn+1)%total;
 document.getElementById('msg').innerText=colors[turn].toUpperCase()+" TURN - Roll 2 Dice";
 if(total===1 || turn!==0) setTimeout(roll, 1200);
}
</script>
</body>
</html>
