<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BINRAO LUDO</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. LOGIN PAGE - TUM WALI PHOTO WALA -->
<section id="loginBox" class="full-page login-page">
  <div class="dark-shade"></div>

  <div class="login-content">
    <h1 class="gold-logo">BINRAO LUDO</h1>
    <p class="tagline">PLAY • WIN • EARN</p>

    <!-- PANDA OR BILLI UPAR WALI - PHOTO SE AAYE GI -->
    <div class="top-chars">
      <span>🐼</span><span>🐱</span><span>🦁</span>
    </div>

    <div class="login-card">
      <input id="loginInput" type="email" placeholder="Email Address">
      <input id="passInput" type="password" placeholder="Password">
      <button class="gold-btn" onclick="doLogin()">LOGIN</button>
      <p id="loginMsg"></p>
      <button class="white-btn" onclick="showSignup()">CREATE NEW ACCOUNT</button>
      <button class="guest-btn" onclick="guestLogin()">Play as Guest ▶</button>
    </div>
  </div>
</section>

<!-- 2. SIGNUP -->
<section id="signupBox" class="full-page login-page" style="display:none">
  <div class="dark-shade"></div>
  <div class="login-content">
    <h1 class="gold-logo">Create Account</h1>
    <div class="login-card">
      <input id="newUser" placeholder="Player Name">
      <input id="newGmail" type="email" placeholder="Email Address">
      <input id="newPass" type="password" placeholder="Password">
      <button class="gold-btn" onclick="doSignup()">SIGN UP</button>
      <p id="signupMsg"></p>
      <button class="white-btn" onclick="showLogin()">BACK TO LOGIN</button>
    </div>
  </div>
</section>

<!-- 3. MAIN MENU - DUSRI PHOTO WALA - BLUE / ORANGE / PURPLE SHADE -->
<main id="mainMenu" class="full-page menu-page" style="display:none">
  <div class="dark-shade"></div>

  <header class="topBar">
    <div class="avatarWrap">
      <img src="https://via.placeholder.com/60">
      <div class="starBadge">⭐ LEVEL <span id="levelText">1</span></div>
    </div>
    <div class="playerInfo"><b id="playerName">Player</b><br><small>Online Player</small></div>
    <div class="balance">🪙 <span id="topCoins">5000</span></div>
    <div class="balance">💎 <span id="topGems">0</span></div>
    <button onclick="openSettings()">⚙️</button>
  </header>

  <div class="menu-content">
    <h2 class="menu-title">🎲 CHOOSE YOUR GAME</h2>

    <div class="grid2">
      <button class="modeCard card-2" onclick="startGame('2player')">
        <h1>2</h1><p>2 Player</p><small>🎲 Play Now</small>
      </button>
      <button class="modeCard card-4" onclick="startGame('4player')">
        <h1>4</h1><p>4 Player</p><small>🎲🎲 Play Now</small>
      </button>
    </div>

    <button class="modeCard long-card" onclick="startGame('offline')">🤖 PLAY OFFLINE <small>Play with Computer</small></button>
    <button class="modeCard long-card blue-card" onclick="startGame('online')">🌍 PLAY ONLINE <small>Play with Players</small></button>
    <button class="modeCard long-card purple-card" onclick="startGame('friends')">👥 PLAY WITH FRIENDS <small>Private Room</small></button>

    <div class="grid3">
      <div class="small">🔒<br>Private<br>Table</div>
      <div class="small">🌍<br>Team Up<br>Online</div>
      <div class="small">👥<br>Team Up<br>Friends</div>
    </div>
  </div>
</main>

<!-- 4. GAME - TEESRI PHOTO WALA BOARD -->
<section id="gameBox" class="full-page game-page" style="display:none">
  <header class="gameHeader"><h2>BINRAO LUDO</h2><button onclick="backToMenu()">🏠 HOME</button></header>
  <div class="gamePlayers">
    <div>🦁 Lion<br>🪙500</div>
    <div>🐱 Cat<br>🪙500</div>
    <div>🐼 Panda<br>🪙500</div>
    <div>🐯 Tiger<br>🪙500</div>
  </div>
  <div id="ludoBoard"><div id="boardGrid"></div></div>
  <div class="diceBox">
    <div id="dice1" class="dice">🎲</div>
    <div id="dice2" class="dice">🎲</div>
    <p id="status">Roll the dice!</p>
    <button onclick="rollDice()">🎲 ROLL DICE</button>
  </div>
</section>

<script src="database.js"></script>
<script src="login.js"></script>
<script src="game.js"></script>
<script src="admin.js"></script>
<script src="script.js"></script>
</body>
</html>
